#ln-design-explorer .ln-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:17px;margin-top:18px}
#ln-design-explorer .ln-detail label{display:grid;gap:6px;font-size:12px;color:#4a5e73}
#ln-design-explorer .ln-detail input,#ln-design-explorer .ln-detail select,#ln-design-explorer .ln-detail textarea{font:inherit;font-size:14px;width:100%;min-width:0;border:1px solid #d7dfe9;border-radius:7px;background:#fff;color:#17212b;padding:9px 10px}
#ln-design-explorer .ln-detail textarea{min-height:70px;resize:vertical}
#ln-design-explorer .ln-detail .ln-span{grid-column:1/-1}
#ln-design-explorer .ln-formactions{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
#ln-design-explorer .ln-cancel{font:inherit;font-size:12px;padding:9px 13px;background:#fff;border:1px solid #dbe1ec;border-radius:7px;color:#566b7d;cursor:pointer}
#ln-design-explorer .ln-event{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:16px;padding-top:12px;border-top:1px solid #e6ebf2;color:#566b7d}
#ln-design-explorer .ln-event .ln-icon{color:#2b8260}
#ln-design-explorer .ln-empty{padding:30px 10px;text-align:center;color:#617084;font-size:13px}
@keyframes ln-panel-in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes ln-toast-in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:850px){#ln-design-explorer [data-style="1"] .ln-grid{grid-template-columns:minmax(0,1fr)}#ln-design-explorer [data-style="1"] .ln-grid>.ln-panel:last-child{display:grid;grid-template-columns:1fr 1fr;gap:22px}#ln-design-explorer [data-style="1"] .ln-team{margin-top:0;padding-top:0;border-top:0}#ln-design-explorer .ln-richmetric{padding:12px}}
@media(max-width:580px){#ln-design-explorer .ln-richmetrics{grid-template-columns:repeat(2,minmax(0,1fr))}#ln-design-explorer [data-style="1"] .ln-grid>.ln-panel:last-child{display:block}#ln-design-explorer [data-style="1"] .ln-team{padding-top:16px;margin-top:16px;border-top:1px solid var(--ln-line)}#ln-design-explorer .ln-detail-grid{grid-template-columns:1fr}#ln-design-explorer .ln-alert-content{align-items:flex-start}#ln-design-explorer .ln-attention{flex-wrap:wrap}#ln-design-explorer .ln-detail input,#ln-design-explorer .ln-detail select,#ln-design-explorer .ln-detail textarea{font-size:16px}#ln-design-explorer .ln-table th,#ln-design-explorer .ln-table td{font-size:12px}#ln-design-explorer .ln-detail{padding:15px}}
@media(prefers-reduced-motion:reduce){#ln-design-explorer *,#ln-design-explorer *::before,#ln-design-explorer *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

<script>
(function(){
const root=document.getElementById('ln-design-explorer');
const app=root.querySelector('.ln-app');
const main=root.querySelector('.ln-main');
const state={concept:'1'};
const metrics=()=>'<div class="ln-metrics"><div class="ln-metric"><span>აქტიური შეკვეთები</span><strong>24</strong></div><div class="ln-metric"><span>დღევანდელი ვიზიტები</span><strong>7</strong></div><div class="ln-metric"><span>ვადაგადაცილებული</span><strong>3</strong></div><div class="ln-metric"><span>ჩასაბარებელი</span><strong>4</strong></div></div>';
const table=()=>'<table class="ln-table"><thead><tr><th>შეკვეთა / ობიექტი</th><th class="ln-optional">შემსრულებელი</th><th>სტატუსი</th></tr></thead><tbody><tr><td>კამერების დიაგნოსტიკა<small>LN-1042 · ალფა ოფისი</small></td><td class="ln-optional">გიორგი<small>10:30</small></td><td><span class="ln-pill">მიმდინარე</span></td></tr><tr><td>სახანძრო სისტემის შემოწმება<small>LN-1043 · ბეტა კლინიკა</small></td><td class="ln-optional">ლევანი<small>12:00</small></td><td><span class="ln-pill">დანიშნული</span></td></tr><tr><td>კარის კონტროლერი<small>LN-1044 · დელტა სასტუმრო</small></td><td class="ln-optional">დაუნიშნავი<small>სასწრაფო</small></td><td><span class="ln-pill">ახალი</span></td></tr><tr><td>ქსელის კაბელის შეცვლა<small>LN-1045 · ალფა ოფისი</small></td><td class="ln-optional">ნიკა<small>15:00</small></td><td><span class="ln-pill">შესრულებული</span></td></tr></tbody></table>';
const visits=()=>'<div><h3>დღევანდელი ვიზიტები</h3><div class="ln-visit"><time>10:30</time><div>ალფა ოფისი<small>გიორგი · კამერები</small></div></div><div class="ln-visit"><time>12:00</time><div>ბეტა კლინიკა<small>ლევანი · სახანძრო</small></div></div><div class="ln-visit"><time>15:00</time><div>ალფა ოფისი<small>ნიკა · ქსელი</small></div></div></div>';
const team=()=>'<div class="ln-team"><h3>დაგეგმილი დატვირთვა</h3><div><span>გიორგი</span><span>6 / 8 სთ</span></div><div class="ln-track" role="img" aria-label="გიორგი, 8 საათიდან 6 დაგეგმილია"><i style="width:75%"></i></div><div><span>ლევანი</span><span>7 / 8 სთ</span></div><div class="ln-track" role="img" aria-label="ლევანი, 8 საათიდან 7 დაგეგმილია"><i style="width:87.5%"></i></div><div><span>ნიკა</span><span>3 / 8 სთ</span></div><div class="ln-track" role="img" aria-label="ნიკა, 8 საათიდან 3 დაგეგმილია"><i style="width:37.5%"></i></div></div>';
const job=(id,title,client,extra,button=false)=>'<div class="ln-job"><small>'+id+'</small><p>'+title+'</p><small>'+client+'</small><span class="ln-pill">'+extra+'</span>'+(button?'<br><button type="button" data-demo="assign">დანიშვნა</button>':'')+'</div>';
const heading=(title,sub)=>'<header class="ln-head"><div><div class="ln-kicker">16 სექტემბერი, ოთხშაბათი</div><h2>'+title+'</h2><p class="ln-caption">'+sub+'</p></div><button type="button" class="ln-create" data-demo="create">+ ახალი შეკვეთა</button></header>';
const attention='<div class="ln-attention"><span>სასწრაფო დაუნიშნავი · კარის კონტროლერი</span><span>LN-1044 ↗</span></div>';
const foot='<div class="ln-foot"><span>კონცეფცია · სადემონსტრაციო მონაცემები</span><span>Line Net CRM</span></div><div class="ln-feedback" hidden role="status"></div>';
const richState={filter:'all',detail:null,selected:null,toast:'',added:0};
const richJobs=[
{id:'LN-1042',title:'კამერების დიაგნოსტიკა',client:'ალფა ოფისი',area:'ვაკე',person:'გიორგი',basePerson:'გიორგი',time:'10:30',status:'progress',icon:'cctv',priority:'მაღალი',overdue:false,description:'სამი კამერის გამოსახულებისა და ჩამწერის მუშაობის შემოწმება.'},
{id:'LN-1043',title:'სახანძრო სისტემის შემოწმება',client:'ბეტა კლინიკა',area:'საბურთალო',person:'ლევანი',basePerson:'ლევანი',time:'12:00',status:'assigned',icon:'flame',priority:'საშუალო',overdue:false,description:'პანელისა და დეტექტორების გეგმური შემოწმება.'},
{id:'LN-1044',title:'კარის კონტროლერის გაუმართაობა',client:'დელტა სასტუმრო',area:'ავლაბარი',person:'',basePerson:'',time:'',status:'new',icon:'door-open',priority:'სასწრაფო',overdue:true,description:'შესასვლელი კარის კონტროლერი არ რეაგირებს ბარათზე. საჭიროა შემსრულებლის დანიშვნა.'},
{id:'LN-1045',title:'ქსელის კაბელის შეცვლა',client:'ალფა ოფისი',area:'ვაკე',person:'ნიკა',basePerson:'ნიკა',time:'15:00',status:'done',icon:'network',priority:'საშუალო',overdue:false,description:'კაბელი შეცვლილია, კავშირი შემოწმებულია. ელოდება მენეჯერის გადახედვას.'}
];
const richLabels={new:'ახალი',assigned:'დანიშნული',progress:'მიმდინარე',done:'შესრულებული'};
const esc=(value)=>String(value).replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=(name)=>'<span class="ln-icon"><i data-lucide="'+name+'" aria-hidden="true"></i></span>';
const richStatus=(job)=>'<span class="ln-status" data-status="'+job.status+'"><i></i>'+richLabels[job.status]+'</span>';
function richTable(){
const jobs=richJobs.filter(j=>richState.filter==='all'||(richState.filter==='unassigned'&&!j.person)||(richState.filter==='overdue'&&j.overdue)||(richState.filter==='review'&&j.status==='done'));
return '<section class="ln-panel"><div class="ln-section-head"><h3>შეკვეთები <span class="ln-count">მოკლე სია</span></h3><span class="ln-caption">'+jobs.length+' ნაჩვენებია</span></div><div class="ln-filters">'+[['all','ყველა'],['unassigned','დაუნიშნავი'],['overdue','ვადაგადაცილებული'],['review','ჩასაბარებელი']].map(([k,l])=>'<button type="button" class="ln-filter" data-rich-filter="'+k+'" aria-pressed="'+(richState.filter===k)+'">'+l+'</button>').join('')+'</div>'+(jobs.length?'<table class="ln-table"><thead><tr><th>შეკვეთა / ობიექტი</th><th class="ln-optional">შემსრულებელი</th><th>სტატუსი</th></tr></thead><tbody>'+jobs.map(j=>'<tr><td><button type="button" class="ln-orderbutton" data-rich-open="'+j.id+'"><span class="ln-job-icon">'+ic(j.icon)+'</span><span><span class="ln-order-title">'+esc(j.title)+'</span><small>'+j.id+' · '+esc(j.client)+'</small></span></button></td><td class="ln-optional">'+(j.person?'<span class="ln-person"><span class="ln-avatar">'+esc(j.person[0])+'</span>'+esc(j.person)+'</span><small>'+esc(j.time||'დაუგეგმავი')+'</small>':'<button type="button" class="ln-softlink" data-rich-open="'+j.id+'">'+ic('user-plus')+'დანიშვნა</button>')+'</td><td>'+richStatus(j)+'</td></tr>').join('')+'</tbody></table>':'<div class="ln-empty">'+ic('circle-check')+'<p>ამ ფილტრში შეკვეთა არ არის</p></div>')+'</section>';
}
function richSide(){
const scheduled=richJobs.filter(j=>j.time);
const planned={'გიორგი':6,'ლევანი':7,'ნიკა':3};
richJobs.forEach(j=>{if(j.time&&j.basePerson&&j.person!==j.basePerson){planned[j.basePerson]-=2;if(j.person)planned[j.person]+=2;}});
return '<aside class="ln-panel"><div><h3 class="ln-side-title">'+ic('calendar-days')+'დღევანდელი ვიზიტები</h3>'+scheduled.map(j=>'<div class="ln-visit"><time>'+j.time+'</time><button type="button" class="ln-visitbutton" data-rich-open="'+j.id+'">'+esc(j.client)+'<small>'+esc(j.person)+' · '+esc(j.area)+'</small></button></div>').join('')+'<p class="ln-mutednote">ნაჩვენებია 3 / 7 ვიზიტი</p><div class="ln-mailpeek"><span>'+ic('mail')+' შემოსულები</span><button type="button" class="ln-softlink" data-rich-action="inbox">5 წერილი '+ic('arrow-up-right')+'</button></div></div><div class="ln-team"><h3 class="ln-side-title">'+ic('users')+'გუნდის დატვირთვა</h3>'+Object.entries(planned).map(([name,hours])=>'<div><span class="ln-person"><span class="ln-avatar">'+name[0]+'</span>'+name+'</span><span>'+hours+' / 8 სთ</span></div><div class="ln-track" role="img" aria-label="'+name+', დაგეგმილია '+hours+' საათი 8 საათიდან"><i style="width:'+Math.min(100,hours/8*100)+'%;background:'+(hours>8?'#c75e50':hours>6?'#bd9c56':'#738fca')+'"></i></div>').join('')+'<p class="ln-mutednote">დაგეგმილი დრო · დღეს</p></div></aside>';
}
function richDetails(){
if(!richState.detail)return '';
const close='<button type="button" class="ln-round-btn" data-rich-action="close" aria-label="დეტალების დახურვა">'+ic('x')+'</button>';
if(richState.detail==='create')return '<section class="ln-detail" aria-label="ახალი შეკვეთის ფორმა"><div class="ln-section-head"><div><small>შეკვეთები / შექმნა</small><h3>ახალი შეკვეთა</h3></div>'+close+'</div><form id="ln-rich-create"><div class="ln-detail-grid"><label class="ln-span">სამუშაოს დასახელება<input name="title" required maxlength="140" placeholder="მაგ. კამერის დიაგნოსტიკა"></label><label>კლიენტი<input name="client" required maxlength="80" placeholder="კლიენტის სახელი"></label><label>პრიორიტეტი<select name="priority"><option>საშუალო</option><option>მაღალი</option><option>სასწრაფო</option></select></label><label class="ln-span">აღწერა<textarea name="description" maxlength="500" placeholder="რა სამუშაოა შესასრულებელი?"></textarea></label></div><div class="ln-formactions"><button type="submit" class="ln-create">'+ic('check')+'შეკვეთის შექმნა</button><button type="button" class="ln-cancel" data-rich-action="close">გაუქმება</button><small>ინახება მხოლოდ ამ მონახაზში</small></div></form></section>';
if(richState.detail==='inbox')return '<section class="ln-detail"><div class="ln-section-head"><div><small>შემოსულები · 5 დაუმუშავებელი</small><h3>შემოსული წერილები</h3></div>'+close+'</div><div class="ln-visit"><span>'+ic('mail')+'</span><div>კამერის დამატების მოთხოვნა<small>ბეტა კლინიკა · 16:05</small></div></div><div class="ln-visit"><span>'+ic('mail')+'</span><div>მომსახურების დაგეგმვა<small>ალფა ოფისი · 15:40</small></div></div><p class="ln-mutednote">ნაჩვენებია 2 / 5 საცდელი წერილი; რეალურ ფოსტასთან კავშირი ამ მონახაზს არ აქვს.</p></section>';
if(richState.detail==='notifications')return '<section class="ln-detail"><div class="ln-section-head"><h3>შეტყობინებები</h3>'+close+'</div><div class="ln-event">'+ic('triangle-alert')+'LN-1044 — სასწრაფო შეკვეთას შემსრულებელი სჭირდება</div><div class="ln-event">'+ic('circle-check')+'LN-1045 — ნიკამ სამუშაო დაასრულა</div><div class="ln-event">'+ic('mail')+'შემოსულებში 5 მოთხოვნაა დასამუშავებელი</div></section>';
const j=richJobs.find(j=>j.id===richState.selected);if(!j)return '';
return '<section class="ln-detail" aria-label="შეკვეთის დეტალები"><div class="ln-section-head"><div><small>'+j.id+' · '+esc(j.client)+' · '+esc(j.area)+'</small><h3>'+esc(j.title)+'</h3>'+richStatus(j)+'</div>'+close+'</div><p class="ln-caption">'+esc(j.description)+'</p><form id="ln-rich-assign"><div class="ln-detail-grid"><label>შემსრულებელი<select name="person" required><option value="">აირჩიე შემსრულებელი</option>'+['გიორგი','ლევანი','ნიკა'].map(p=>'<option'+(p===j.person?' selected':'')+'>'+p+'</option>').join('')+'</select></label><label>პრიორიტეტი<input value="'+esc(j.priority)+'" readonly></label></div><div class="ln-formactions"><button type="submit" class="ln-create">'+ic('user-check')+'დანიშვნის შენახვა</button><small>ცვლილება აისახება საცდელ სიაში</small></div></form><div class="ln-event">'+ic(j.person?'user-check':'clock-3')+(j.person?'დანიშნულია: '+esc(j.person):'ელოდება შემსრულებლის დანიშვნას')+'</div></section>';
}
function renderRefined(){
const title='<header class="ln-head"><div><div class="ln-kicker">ოთხშაბათი · 16 სექტემბერი</div><h2>სამუშაო დაფა</h2><p class="ln-caption">დღევანდელი პრიორიტეტები და გუნდის საქმეები</p></div><div class="ln-header-actions"><button type="button" class="ln-round-btn" data-rich-action="notifications" aria-label="შეტყობინებები">'+ic('bell')+'<span class="ln-dot"></span></button><button type="button" class="ln-create" data-rich-action="create">'+ic('plus')+'ახალი შეკვეთა</button></div></header>';
const metricItems=[['all','აქტიური შეკვეთები',24+richState.added,'clipboard-list',''],['visits','დღევანდელი ვიზიტები',7,'calendar-days','orange'],['overdue','ვადაგადაცილებული',3,'triangle-alert','red'],['review','ჩასაბარებელი',4,'circle-check','green']];
const metricHtml='<div class="ln-richmetrics">'+metricItems.map(([key,label,val,icon,color])=>'<button type="button" class="ln-richmetric" data-rich-metric="'+key+'"><div><strong>'+val+'</strong><span class="ln-stat-icon '+color+'">'+ic(icon)+'</span></div><span>'+label+'</span></button>').join('')+'</div>';
const urgent=richJobs.find(j=>j.id==='LN-1044');
const alert=urgent&&!urgent.person?'<div class="ln-attention"><span class="ln-alert-content">'+ic('siren')+'<span>სასწრაფო დაუნიშნავი · კარის კონტროლერი</span></span><button type="button" class="ln-alert-link" data-rich-open="LN-1044">დანიშვნა '+ic('arrow-right')+'</button></div>':'';
return title+metricHtml+alert+'<div class="ln-grid">'+richTable()+richSide()+'</div>'+(richState.toast?'<div class="ln-toast" role="status">'+ic('circle-check')+' '+esc(richState.toast)+'</div>':'')+richDetails()+'<div class="ln-foot"><span>ინტერაქტიული მონახაზი · საცდელი მონაცემები</span><span>Line Net CRM / 01</span></div>';
}
function updateRich(){render();if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
}
root.addEventListener('click',e=>{
const b=e.target.closest('button');if(!b||state.concept!=='1')return;
if(b.dataset.richFilter){richState.filter=b.dataset.richFilter;richState.toast='';updateRich();const target=main.querySelector('[data-rich-filter="'+richState.filter+'"]');if(target)target.focus({preventScroll:true});}
if(b.dataset.richOpen){richState.detail='order';richState.selected=b.dataset.richOpen;richState.toast='';updateRich();focusRichPanel();}
if(b.dataset.richAction){const a=b.dataset.richAction;richState.detail=a==='close'?null:a;richState.toast='';updateRich();if(a!=='close')focusRichPanel();}
if(b.dataset.richMetric){const f=b.dataset.richMetric;if(f==='visits'){richState.detail='order';richState.selected='LN-1042';}else{richState.filter=f;richState.detail=null;}richState.toast='';updateRich();if(f==='visits')focusRichPanel();}
});
function focusRichPanel(){const p=main.querySelector('.ln-detail');if(p){p.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'});const input=p.querySelector('input,select,button');if(input)input.focus({preventScroll:true});}}
root.addEventListener('submit',e=>{
const form=e.target;if(!(form instanceof HTMLFormElement)||!form.id.startsWith('ln-rich-'))return;e.preventDefault();if(!form.reportValidity())return;const data=new FormData(form);
if(form.id==='ln-rich-create'){const title=String(data.get('title')||'').trim();const client=String(data.get('client')||'').trim();if(!title||!client){richState.toast='შეავსე დასახელება და კლიენტი';updateRich();return;}
richState.added++;const id='LN-'+(1046+richState.added);richJobs.unshift({id,title,client,area:'მისამართი დასაზუსტებელია',person:'',basePerson:'',time:'',status:'new',icon:'wrench',priority:String(data.get('priority')),overdue:false,description:String(data.get('description')||'აღწერა არ არის დამატებული')});richState.toast=id+' დაემატა საცდელ სიას';richState.filter='all';richState.detail=null;
}else if(form.id==='ln-rich-assign'){const j=richJobs.find(j=>j.id===richState.selected);const p=String(data.get('person'));if(j&&['გიორგი','ლევანი','ნიკა'].includes(p)){j.person=p;if(j.status==='new')j.status='assigned';richState.toast=j.id+' — დანიშნულია '+p;richState.detail=null;}}
updateRich();
});

function render(){
app.dataset.style=state.concept;
root.querySelectorAll('[data-concept]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.concept===state.concept)));
if(state.concept==='1')main.innerHTML=renderRefined();
if(state.concept==='2')main.innerHTML=heading('გუნდი და ვიზიტები','დღის სამუშაოების განაწილება')+metrics()+'<div class="ln-dispatch"><section><h3>დაუნიშნავი · 6</h3>'+job('LN-1044','კარის კონტროლერის გაუმართაობა','დელტა სასტუმრო · ავლაბარი','სასწრაფო',true)+job('LN-1046','კამერის დამატება','ბეტა კლინიკა · საბურთალო','ახალი',true)+'</section><section class="ln-panel"><h3>დღევანდელი განრიგი · 7 ვიზიტი</h3><div class="ln-timeline"><span></span><span class="ln-time">09–12</span><span class="ln-time">12–15</span><span class="ln-time">15–18</span><span class="ln-tech">გიორგი</span><div class="ln-slot"><div class="ln-task">კამერები<small>10:30<br>ალფა ოფისი</small></div></div><div class="ln-slot"></div><div class="ln-slot"></div><span class="ln-tech">ლევანი</span><div class="ln-slot"></div><div class="ln-slot"><div class="ln-task">სახანძრო<small>12:00<br>ბეტა კლინიკა</small></div></div><div class="ln-slot"></div><span class="ln-tech">ნიკა</span><div class="ln-slot"></div><div class="ln-slot"></div><div class="ln-slot"><div class="ln-task">ქსელი<small>15:00<br>ალფა ოფისი</small></div></div></div></section></div>'+foot;
if(state.concept==='3')main.innerHTML=heading('სამუშაოების მდგომარეობა','ოპერაციები / შემოწმებული 16:20-ზე')+metrics()+'<div class="ln-queues"><section class="ln-queue"><h3>ყურადღება <span>3</span></h3>'+job('LN-1044','კარის კონტროლერი','დელტა სასტუმრო','ვადაგადაცილებული')+'</section><section class="ln-queue"><h3>მიმდინარე <span>10</span></h3>'+job('LN-1042','კამერების დიაგნოსტიკა','ალფა ოფისი · გიორგი','მიმდინარე')+'</section><section class="ln-queue"><h3>ჩასაბარებელი <span>4</span></h3>'+job('LN-1045','ქსელის კაბელის შეცვლა','ალფა ოფისი · ნიკა','შესრულებული')+'</section></div><section class="ln-panel"><h3>ბოლო შეკვეთები</h3>'+table()+'</section>'+foot;
if(state.concept==='4')main.innerHTML=heading('დღის მიმოხილვა','სამუშაოები, გუნდი და შედეგები')+'<div class="ln-editorial"><section class="ln-summary"><div class="ln-kicker">მიმდინარე სამუშაოები</div><h3>დღეს 7 ვიზიტია<br>დაგეგმილი</h3><div class="ln-metrics"><div class="ln-metric"><span>აქტიური შეკვეთები</span><strong>24</strong></div><div class="ln-metric"><span>შესრულდა ამ კვირაში</span><strong>18</strong></div></div></section><section class="ln-panel"><h3>მოქმედება სჭირდება</h3><div class="ln-action"><span>ვადაგადაცილებული</span><span>3 ↗</span></div><div class="ln-action"><span>ჩასაბარებელი</span><span>4 ↗</span></div><div class="ln-action"><span>შემოსული წერილები</span><span>5 ↗</span></div><div class="ln-action"><span>დაუნიშნავი სასწრაფო</span><span>1 ↗</span></div></section></div><div class="ln-editorial"><section class="ln-panel">'+visits()+'</section><section class="ln-panel">'+team()+'<div class="ln-money"><div>₾12,400<small>მიღებული · კვირა</small></div><div>₾8,700<small>გადაუხდელი · სულ</small></div></div></section></div>'+foot;
}
root.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;if(button.dataset.concept){state.concept=button.dataset.concept;render()}if(button.dataset.demo){const notice=main.querySelector('.ln-feedback');notice.hidden=false;notice.textContent=button.dataset.demo==='assign'?'ვიზუალური მონახაზი: აქ გაიხსნება შემსრულებლის არჩევა.':'ვიზუალური მონახაზი: აქ გაიხსნება ახალი შეკვეთის ფორმა.'}});
render();
if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:render});tweak.addSelect(state,'concept',{label:'მიმართულება',options:[{label:'1. მშვიდი მინიმალიზმი',value:'1'},{label:'2. დისპეტჩერის დაფა',value:'2'},{label:'3. მუქი საინჟინრო',value:'3'},{label:'4. მენეჯერის მიმოხილვა',value:'4'}]});}
})();
</script>
